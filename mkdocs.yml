site_name: Kiwi Network
site_description: Self-hosted, privacy-first infrastructure for individuals, SMBs, and public offices.
site_url: https://kiwi-network.eu/docs/
repo_url: https://github.com/derlocke-ng/kiwi-network
repo_name: kiwi-network

site_dir: build/docs

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.sections
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Network Model: getting-started/network-model.md
  - Architecture:
      - Overview: architecture/index.md
      - kiwi-master: architecture/kiwi-master.md
      - kiwi-node: architecture/kiwi-node.md
      - kiwi-workstation: architecture/kiwi-workstation.md
  - Build & Deploy:
      - kiwi-server: build/kiwi-server.md
  - Apps & Updates:
      - kiwi-updater: apps/kiwi-updater.md
      - kiwi-catalog: apps/kiwi-catalog.md
  - Privacy Apps:
      - Overview: privacy-apps/index.md
      - kiwi-fox: privacy-apps/kiwi-fox.md
      - Provider plugins: privacy-apps/plugins.md
      - kiwi-killswitch: privacy-apps/kiwi-killswitch.md
      - kiwi-gen: privacy-apps/kiwi-gen.md
      - kiwi-pentesting: privacy-apps/kiwi-pentesting.md
      - Desktop CLI tools: privacy-apps/cli-tools.md
  - Federation: federation/index.md
  - Compliance: compliance/index.md
  - Roadmap: roadmap.md
  - Contributing: contributing.md
