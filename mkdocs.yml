site_name: Kiwi Network
site_description: Kiwi Network is an open-source Linux environment you run yourself. Your servers, devices and desktop in one private network that installs, updates, backs up and recovers on its own.
site_url: https://kiwi-network.eu/docs/

site_dir: build/docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  homepage: https://kiwi-network.eu/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/derlocke-ng/kiwi-network
      name: kiwi-network on GitHub

