site_name: Kiwi Network
site_description: Open-source tools to connect what is yours — a private WireGuard mesh built from one file, peer-to-peer tools over nostr, and apps for Fedora Atomic desktops.
site_url: https://kiwi-network.eu/docs/
repo_url: https://github.com/derlocke-ng/kiwi-network
repo_name: derlocke-ng/kiwi-network
edit_uri: edit/main/docs/

site_dir: build/docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  logo: assets/icons/kiwi-network.svg
  favicon: assets/icons/kiwi-network.svg
  font: false
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

extra:
  homepage: https://kiwi-network.eu/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/derlocke-ng
      name: derlocke-ng on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Network:
      - How it works: network/index.md
      - DNS, names & certificates: network/dns.md
      - Routers: network/routers.md
      - kiwi-server:
          - Overview: server/index.md
          - The fleet file: server/fleet.md
          - Roles: server/roles.md
          - Modules: server/modules.md
          - Machines: server/machines.md
          - Operations: server/operations.md
      - One machine without a fleet: server/single.md
  - People:
      - Hubs on nostr: people/index.md
      - Armory: people/armory.md
      - Running your own hub: people/hubs.md
  - Desktop:
      - Overview: desktop/index.md
      - kiwi-updater: desktop/kiwi-updater.md
      - Catalogs & publishing: desktop/catalogs.md
      - ensconce: desktop/ensconce.md
      - kiwi-killswitch: desktop/kiwi-killswitch.md
      - Client networks:
          - Overview: clients/index.md
          - kiwi-proxy: clients/kiwi-proxy.md
          - kiwi-custodia: clients/kiwi-custodia.md
          - kiwi-fox: clients/kiwi-fox.md
          - Provider modules: clients/providers.md
      - gnome-monitor: desktop/gnome-monitor.md
      - syncman: desktop/syncman.md
      - kiwi-cli-tools-desktop: desktop/cli-tools.md
      - kiwi-gen: desktop/kiwi-gen.md
  - Project:
      - Repositories & status: project/status.md
      - Icons & colours: project/brand.md
      - Contributing: project/contributing.md
