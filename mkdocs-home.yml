site_name: Kiwi Network
site_description: Self-hosted, privacy-first infrastructure for individuals, SMBs, and public offices.
site_url: https://kiwi-network.eu/
repo_url: https://github.com/derlocke-ng/kiwi-network
repo_name: kiwi-network

# Build output for the homepage (deployed at /)
site_dir: build/home

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Docs: https://kiwi-network.eu/docs/
  - GitHub: https://github.com/derlocke-ng/kiwi-network
